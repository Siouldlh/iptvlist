name: supervision-cartouchemalin

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      probe_url:
        description: "URL de sonde ponctuelle pour test (vide = sondes normales)"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - ".github/workflows/supervision-cartouchemalin.yml"
      - "supervision/**"

permissions:
  contents: write

concurrency:
  group: supervision-cartouchemalin
  cancel-in-progress: false

jobs:
  sonde:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - name: Sondes HTTP et alertes
        env:
          AGENTMAIL_API_KEY: ${{ secrets.AGENTMAIL_API_KEY }}
          AGENTMAIL_INBOX: ${{ secrets.AGENTMAIL_INBOX }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PAUSED: ${{ vars.PAUSED }}
          PROBE_URL: ${{ github.event.inputs.probe_url || '' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 supervision/check.py

      - name: Snapshot d'etat
        if: always()
        run: |
          git config user.name "supervision-cartouchemalin"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add supervision/etat.json
          if ! git diff --cached --quiet; then
            git commit -m "supervision: snapshot etat $(date -u '+%Y-%m-%dT%H:%M:%SZ') [skip ci]" -m "Co-Authored-By: Paperclip <noreply@paperclip.ing>"
            for i in 1 2 3; do
              git push && break
              git pull --rebase origin main || true
              sleep 5
            done
          fi